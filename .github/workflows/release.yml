name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (biome)
        run: pnpm run check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

  release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Verify version consistency
        # git tag（v0.2.0）の数値部分と package.json / src/index.ts の VERSION が一致することを確認する。
        # ずれたまま publish するとイメージタグとアプリ自己申告バージョンが乖離する。
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(node -p "require('./package.json').version")
          SRC_VER=$(grep -oP '(?<=const VERSION = ")[^"]+' src/index.ts)
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "ERROR: git tag ($TAG_VER) != package.json version ($PKG_VER)"
            exit 1
          fi
          if [ "$TAG_VER" != "$SRC_VER" ]; then
            echo "ERROR: git tag ($TAG_VER) != src/index.ts VERSION ($SRC_VER)"
            exit 1
          fi
          echo "Version OK: $TAG_VER"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 安定リリース用タグを発行する（vX.Y.Z push → :X.Y.Z / :X.Y）。
      # :latest は flavor latest=auto（デフォルト）により非 prerelease の
      # semver タグにのみ自動付与される。開発ビルド（:main）は docker.yml が担う。
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # タグ名に "-" が含まれる場合（v0.2.0-rc.1 等）を prerelease として扱う。
          # Docker の latest=auto と GitHub Release の安定版判定を揃えるため。
          prerelease: ${{ contains(github.ref_name, '-') }}
